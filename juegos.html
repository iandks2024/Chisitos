<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentes Únicas | Juegos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style3.css">
</head>
<body>

    <nav class="navbar navbar-expand">
        <div class="container">
            <a class="navbar-brand" href="indexPrincipal.html">← Volver a Mentes Únicas</a>
        </div>
    </nav>

    <section class="container seccion-juegos" id="juegos">
        <h2>¡Elegí tu aventura!</h2>
        <p>Aprendé, jugá y descubrí cosas nuevas.</p>

        <div class="row g-4">

            <div class="col-md-4">
                <div class="card">
                    <img src="img/libro.png" class="card-img-top" alt="Letras y palabras">
                    <div class="card-body">
                        <h5>Letras y palabras</h5>
                        <p>Descubrí letras y aprendé nuevas palabras.</p>
                        <a href="https://arbolabc.com/?utm_source=chatgpt.com" class="btn boton" target="_blank" rel="noopener noreferrer">Explorar</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <img src="img/cerebro.png" class="card-img-top" alt="Mundo de números">
                    <div class="card-body">
                        <h5>Mundo de números</h5>
                        <p>Aprendé a contar y resolver desafíos.</p>
                        <a href="https://www.mundoprimaria.com/juegos-educativos/juegos-matematicas?utm_source=chatgpt.com" class="btn boton" target="_blank" rel="noopener noreferrer">Jugar</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <img src="img/colores.png" class="card-img-top" alt="Espacio creativo">
                    <div class="card-body">
                        <h5>Espacio creativo</h5>
                        <p>Coloreá, dibujá y creá tus propias ideas.</p>
                        <a href="https://simplesketchpad.com/es/kids-drawing/?utm_source=chatgpt.com" class="btn boton" target="_blank" rel="noopener noreferrer">Crear</a>
                    </div>
                </div>
            </div>

        </div>
    </section>

</body>
</html>
